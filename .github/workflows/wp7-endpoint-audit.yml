name: Audit WP7 exact RK4 endpoint and paired result stability

on:
  push:
    branches:
      - audit-wp7-endpoint-atomic-verify
    paths:
      - .github/workflows/wp7-endpoint-audit.yml

jobs:
  focused-endpoint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install simulator + property / optimization libraries
        run: python -m pip install -e '.[realfluid,qp]'
      - name: Check endpoint-only rejection and existing transfer tests
        run: python -m unittest discover -s tests -p 'test_wp7_control.py' -v
      - name: Recreate independent 15-run research benchmark
        run: |
          cp results/wp7_control_pilot.json /tmp/wp7_published.json
          python scripts/run_wp7_control.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          a=json.loads(Path('/tmp/wp7_published.json').read_text())
          b=json.loads(Path('results/wp7_control_pilot.json').read_text())
          for k in ('benchmark_id','run_count','completed_runs','service_eligible_pairs','terminal_and_service_equivalent_pairs'):
              assert a[k]==b[k],(k,a[k],b[k])
          maprun=lambda data:{(r['case'],r['controller']):r for r in data['runs']}
          old,new=maprun(a),maprun(b)
          assert old.keys()==new.keys()
          for k in old:
              x,y=old[k],new[k]
              for key in ('status','matched_service_gate','pi_fallbacks'):
                  assert x[key]==y[key],(k,key,x[key],y[key])
              for key in ('iae_Ks','electricity_kWh','max_energy_residual_J'):
                  if x[key] is None:
                      assert y[key] is None
                  else:
                      assert math.isclose(x[key],y[key],rel_tol=1e-7,abs_tol=1e-4),(k,key,x[key],y[key])
          print('WP7 endpoint check reproduced all',len(old),'published pilot runs')
          PY
