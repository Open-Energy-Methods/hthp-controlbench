name: Import prepared WP1 and WP2 source
on:
  push:
    paths:
      - 'bootstrap.py'
      - '.github/workflows/import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand prepared source snapshot
        run: python bootstrap.py
      - name: Commit the source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Import WP1/WP2 research source, tests and documentation"
            git push
          fi
