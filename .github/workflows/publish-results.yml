name: Reproduce and publish WP2 synthetic evidence

on:
  push:
    paths:
      - '.github/workflows/publish-results.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[plots]'
      - name: Run numerical tests and record evidence
        run: |
          mkdir -p results
          python -m unittest discover -s tests -v > results/test_suite.txt 2>&1
      - name: Run open-loop synthetic simulation
        run: python -m ht_hp_controlbench > results/run_log.txt 2>&1
      - name: Reproduce plot and sensitivity sweep
        run: python scripts/make_report.py
      - name: Commit generated results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if ! git diff --cached --quiet; then
            git commit -m "Reproduce WP2 synthetic numerical evidence"
            git push
          fi
