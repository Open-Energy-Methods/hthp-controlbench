name: Python physics tests
on:
  push:
  pull_request:
jobs:
  physics-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and plotting dependencies
        run: python -m pip install -e '.[plots,qp,realfluid]'
      - name: Run physics and numerical tests
        run: python -m unittest discover -s tests -v
      - name: Run scripted simulation
        run: python -m ht_hp_controlbench
      - name: Reproduce plots and UA sensitivity
        run: python scripts/make_report.py
      - name: Reproduce WP3 PI identification and closed-loop sweep
        run: python scripts/run_wp3.py
      - name: Reproduce WP3 robustness stress-test matrix
        run: python scripts/run_wp3_robustness.py
      - name: Reproduce WP4 constrained MPC and baseline comparison
        run: python scripts/run_wp4.py
      - name: Audit QP backends with OSQP
        run: python scripts/run_wp4_solver_audit.py
      - name: Reproduce WP4 partial-observation robustness matrix
        if: matrix.python-version == '3.12'
        run: python scripts/run_wp4_robustness.py
      - name: Reproduce WP5 service-gated controller comparison
        run: python scripts/run_wp5.py
      - name: Freeze corrected relay-peak L1 benchmark without rewriting legacy files
        if: matrix.python-version == '3.12'
        run: python scripts/snapshot_a01_rebenchmark.py
      - name: Upload corrected WP3–WP5 synthetic L1 results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: audit-a01-L1_RelayPeak_v2
          path: results/L1_RelayPeak_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Audit regenerated WP3–WP5 numerics against reviewed L1 v2 snapshot
        if: matrix.python-version == '3.12'
        run: python scripts/check_published_benchmark.py
      - name: Reproduce WP6 active-set and self-optimising control study
        run: python scripts/run_wp6.py
      - name: Reproduce WP7 CoolProp cycle and fluid property screen
        run: python scripts/run_wp7.py
      - name: Install TESPy for separate component-network checks
        if: matrix.python-version != '3.10'
        run: python -m pip install -e '.[tespy]'
      - name: Test WP7 TESPy network against direct CoolProp states
        if: matrix.python-version != '3.10'
        run: python -m unittest discover -s tests -p 'test_wp7_tespy.py' -v
      - name: Cross-check WP7 direct cycle in TESPy network
        if: matrix.python-version != '3.10'
        run: python scripts/run_wp7_tespy.py
      - name: Complete WP7 system-coupled research and TESPy genuine offdesign verification
        if: matrix.python-version != '3.10'
        run: python scripts/run_wp7_completion.py
      - name: Generate matched WP7 property-truth PI/MPC control pilot
        if: matrix.python-version == '3.12'
        run: python scripts/run_wp7_control.py
      - name: Upload WP7 property-generated reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: wp7-coolprop-thermodynamic-screen
          path: |
            results/wp7_*.csv
            results/wp7_*.json
            results/wp7_*.md
            results/wp7_*.png
          if-no-files-found: error
          retention-days: 90

      - name: Reproduce WP8 storage feasibility and tariff scenarios
        if: matrix.python-version == '3.12'
        run: python scripts/run_wp8.py --full
      - name: Upload WP8 generated reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: wp8-thermal-storage-flexibility
          path: |
            results/wp8_*.csv
            results/wp8_*.json
            results/wp8_*.md
            results/wp8_*.png
          if-no-files-found: error
          retention-days: 90
