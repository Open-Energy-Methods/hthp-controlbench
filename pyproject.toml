[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hthp-controlbench"
version = "0.1.0"
description = "Synthetic thermal plant and research infrastructure for HTHP control benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhijith Sivaprasadan"}]
dependencies = ["numpy>=2.0,<3", "scipy>=1.11.4,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Development Status :: 2 - Pre-Alpha",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
qp = ["osqp>=1.0,<2"]
realfluid = ["CoolProp>=8.0,<9"]
tespy = ["tespy>=0.11,<0.12"]

[tool.setuptools.packages.find]
include = ["ht_hp_controlbench*"]
